[project]
name = "gtfs-zone-rt-archive"
version = "0.1.0"
requires-python = ">=3.13"
description = "Records GTFS-realtime feeds and publishes them as TIDES data packages"
license = "AGPL-3.0-or-later"
dependencies = [
    "httpx>=0.28",
    "obstore>=0.12",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "zstandard>=0.25",
]

[project.scripts]
gtfs-zone-rt-archive = "gtfs_zone_rt_archive.cli:main"

[dependency-groups]
dev = [
    "commitizen",
    "deptry>=0.25.1",
    "pytest",
    "ruff",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_zone_rt_archive"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.vulture]
paths = ["src"]
ignore_decorators = ["@field_validator", "@model_validator"]
# main: console script. producer, build_lag_days, lines: read by the TIDES build.
ignore_names = ["cls", "model_config", "main", "producer", "build_lag_days", "lines"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
bump_message = "chore(release): bump version $current_version -> $new_version"
annotated_tag = true
pre_bump_hooks = [
    "bash -c 'branch=$(git branch --show-current); [ \"$branch\" = \"main\" ] || { echo \"Error: cz bump must be run on main (currently on \\\"$branch\\\")\"; exit 1; }'",
]
